[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-data-platform"
version = "0.1.0"
description = "Enterprise retail data engineering platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
