
services:
  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:?Required}
      POSTGRES_USER: ${INVENTORY_DB_USER:?Required}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:?Required}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:?Required}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?Required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  inventory_data:
  warehouse_data:
